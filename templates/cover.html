<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="file://{{ base_css }}">
<style>
  .frame { background: #000; }
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.05) 30%, rgba(0,0,0,0.75) 72%, rgba(0,0,0,0.92) 100%);
  }
  .content {
    position: absolute;
    left: 80px; right: 80px; bottom: 96px;
    z-index: 10;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .slide-headline { color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,0.35); font-size: 92px; line-height: 1.05; }
  .slide-subhead { margin-top: 20px; color: rgba(255,255,255,0.85); text-shadow: 0 2px 10px rgba(0,0,0,0.35); }
</style>
</head>
<body>
  <div class="frame">
    <img class="bg-photo" src="file://{{ photo }}">
    <div class="scrim"></div>
    <div class="logo-watermark pos-center"><img src="file://{{ logo }}"></div>
    <div class="content">
      <div class="slide-headline">{{ headline }}</div>
      {% if subhead %}<div class="slide-subhead">{{ subhead }}</div>{% endif %}
    </div>
  </div>
</body>
</html>
