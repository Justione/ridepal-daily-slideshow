<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="file:///Users/justinrausch/ridepal-daily-slideshow/assets/css/base.css">
<style>
  body { background: #333; }
  .stage { position: absolute; top: 40px; left: 40px; }
  .map-card { --card-w: 520px; }
  .map3d { height: 494px; }
  .dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: red; z-index: 50; transform: translate(-50%, -50%); }
  .lbl { position: absolute; z-index: 51; color: #fff; background: rgba(0,0,0,0.7); font-size: 11px; font-weight: bold; padding: 1px 3px; border-radius: 3px; transform: translate(6px, -8px); white-space: nowrap; }
</style>
</head>
<body>
  <div class="stage">
    <div class="map-card">
      <div class="map3d">
        <div class="map3d-viewport">
          <div class="map3d-plane">
            <img src="file:///Users/justinrausch/ridepal-daily-slideshow/assets/generated-maps/boogie-man-card.png">
            <div id="dots" style="position:absolute; inset:0;"></div>
          </div>
        </div>
      </div>
      <div style="height:300px;background:#fff;"></div>
    </div>
  </div>
<script>
  const nominalW = 520, nominalH = 494;
  const oW = nominalW * 1.30, oH = nominalH * 1.90;
  const c = document.getElementById('dots');
  function place(fx, fy, text) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.style.left = (fx * oW) + 'px';
    d.style.top = (fy * oH) + 'px';
    c.appendChild(d);
    const l = document.createElement('div');
    l.className = 'lbl';
    l.style.left = (fx * oW) + 'px';
    l.style.top = (fy * oH) + 'px';
    l.textContent = text;
    c.appendChild(l);
  }
  // vertical probe at fx=0.5, fine near the top cutoff
  for (let fy = 0.30; fy <= 1.0001; fy += 0.02) {
    place(0.5, fy, 'y' + fy.toFixed(2));
  }
  // horizontal probe at fy=0.75 (known-visible), fine near both edges
  for (let fx = 0; fx <= 1.0001; fx += 0.02) {
    place(fx, 0.75, 'x' + fx.toFixed(2));
  }
</script>
</body>
</html>
